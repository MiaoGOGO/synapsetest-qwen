[pytest]
# pytest 配置文件
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
# 测试发现模式
norecursedirs = .git .venv venv __pycache__ *.egg-info
# 日志配置
log_cli = false
log_cli_level = INFO
# 覆盖率配置（可选）
# --cov=.
# --cov-report=html
# --cov-report=term-missing

